# CelebA-Test evaluation config — full OSDFace paper Table 1 metrics.
# Paired HQ/LQ data; both stage-1 (VQVAE) and stage-2 (diffusion) are scored.

dataset: celeba

# ── Inputs ────────────────────────────────────────────────────────────────
lq_dir:   /projectnb/cs585/projects/craft/data/test/CelebA/Self_CelebA_Validation_v2/self_celeba_512_v2
hq_dir:   /projectnb/cs585/projects/craft/data/test/CelebA/CelebA_Validation/celeba_512_validation
ffhq_dir: /projectnb/cs585/projects/craft/data/train/images512x512

# ── Shared ────────────────────────────────────────────────────────────────
parser_ckpt:  /projectnb/cs585/projects/craft/pretrained/79999_iter.pth
results_root: /projectnb/cs585/projects/craft/Evaluation_Results

# ── CRAFT ─────────────────────────────────────────────────────────────────
craft:
  stage1_ckpt: /projectnb/cs585/projects/craft/checkpoints/phase_d/final.pt
  stage2_ckpt: /projectnb/cs585/projects/craft/checkpoints_stage2/final.pt
  embed_dim:   512
  rq_levels:   3
  hq_n_codes:  1024

# ── OSDFace ───────────────────────────────────────────────────────────────
osdface:
  stage1_ckpt: /projectnb/cs585/projects/craft/checkpoints_osdface/phase_c/final.pt
  stage2_ckpt: /projectnb/cs585/projects/craft/checkpoints_stage2_osdface/final.pt
  embed_dim:   512
  lq_n_codes:  1024

# ── Stage-2 common (SD 1.5 + LoRA) ────────────────────────────────────────
# Stage-2 was trained against SD 1.5 (768-dim cross-attn). Point this at a
# local copy fetched from ModelScope (sd-legacy/stable-diffusion-v1-5).
stage2:
  pretrained_model: /projectnb/cs585/projects/craft/pretrained/stable-diffusion-v1-5
  mixed_precision:  fp16
  lora_rank:        16
  lora_alpha:       16
  t_fixed:          999
  context_dim:      768
  # Legacy keys (ignored by the new generator-based path, kept for run_eval.sh)
  merge_lora:       false
  prompts_json:     ""
