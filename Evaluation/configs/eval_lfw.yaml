# LFW-Test evaluation config — OSDFace paper Table 2 metrics.
# LQ-only (no GT), so full-reference metrics (LPIPS/DISTS/PSNR/SSIM/Deg./LMD/
# FID-HQ) are automatically skipped by evaluate.py.

dataset: lfw

# ── Inputs ────────────────────────────────────────────────────────────────
lq_dir:   /projectnb/cs585/projects/craft/data/test/LFW/cropped_faces
hq_dir:   ""
ffhq_dir: /projectnb/cs585/projects/craft/data/train/images512x512

# ── Shared ────────────────────────────────────────────────────────────────
parser_ckpt:  /projectnb/cs585/projects/craft/pretrained/79999_iter.pth
results_root: /projectnb/cs585/projects/craft/Evaluation_Results

# ── CRAFT ─────────────────────────────────────────────────────────────────
craft:
  stage1_ckpt: /projectnb/cs585/projects/craft/checkpoints/phase_d/final.pt
  stage2_ckpt: /projectnb/cs585/projects/craft/checkpoints_stage2/final.pt
  embed_dim:   512
  rq_levels:   3
  hq_n_codes:  1024

# ── OSDFace ───────────────────────────────────────────────────────────────
osdface:
  stage1_ckpt: /projectnb/cs585/projects/craft/checkpoints_osdface/phase_c/final.pt
  stage2_ckpt: /projectnb/cs585/projects/craft/checkpoints_stage2_osdface/final.pt
  embed_dim:   512
  lq_n_codes:  1024

# ── Stage-2 common (SD 2.1 + LoRA) ────────────────────────────────────────
# Official HF `stabilityai/stable-diffusion-2-1-base` is no longer downloadable;
# point this at the local copy fetched from ModelScope (see Evaluation README).
stage2:
  pretrained_model: /projectnb/cs585/projects/craft/pretrained/stable-diffusion-2-1-base
  mixed_precision:  fp16
  merge_lora:       true
  lora_rank:        16
  lora_alpha:       16
  prompts_json:     ""
